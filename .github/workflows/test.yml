name: Test
on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  Test-Linux:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq 
          sudo apt-get install -y libcap2-bin libtest-command-perl lcov iproute2
          sudo sysctl net.ipv4.ping_group_range='0 2147483647'

      - name: Build
        run: |
          ci/build-1-autotools.sh
          ci/build-4-compile.sh
          ci/test-tarball.sh

      - name: Test
        run: |
          set -ex
          PATH=`pwd`/src:$PATH
          # avoid pinging internet hosts because it doesn't
          # work with GitHub Actions being hosted in Azure.
          prove $(ls ci/test-*.pl|grep -v internet-hosts)
          sudo env FPING_RUN_UNSAFE_TESTS=1 PATH="$(pwd)/src:$PATH" prove ci/unsafe-test-*.pl
          ci/run-lcov.sh

      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          flag-name: ${{ matrix.os }}
          parallel: true

      - name: Upload fping binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fping-binary-${{ matrix.os }}-${{ github.sha }}
          path: src/fping

  Test-Asymmetric-Routing:
    needs: [Test-Linux]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download fping binary from Test-Linux
        id: download
        uses: actions/download-artifact@v8.0.2
        with:
          name: fping-binary-${{ matrix.os }}-${{ github.sha }}
          path: src/
        continue-on-error: true

      - name: Fallback - Build fping if download failed
        if: steps.download.outcome == 'failure'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcap2-bin libtest-command-perl
          ci/build-1-autotools.sh
          ci/build-4-compile.sh

      - name: Make fping executable
        run: chmod +x src/fping

      - name: Install tcpdump and net-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tcpdump net-tools

      - name: Test asymmetric routing (--oiface)
        run: sudo ci/test-oiface.sh

      - name: Test asymmetric ipv6 routing (--oiface)
        run: sudo ci/test-oiface-ipv6.sh

  Test-Alpine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Enable unprivileged ping on host
        run: sudo sysctl net.ipv4.ping_group_range='0 2147483647'

      - name: Build and test in Alpine container
        run: |
          docker run --rm --network host -v "$PWD:/work" -w /work alpine:latest sh -euxc '
            apk add --no-cache build-base autoconf automake libcap perl perl-utils perl-test-command
            autoreconf -i
            ./configure --enable-ipv4 --enable-ipv6 --enable-safe-limits --prefix=/opt/fping
            make
            adduser -D testuser
            chown -R testuser:testuser .
            chown root:root src/fping
            chmod u+s src/fping
            su testuser -c "PATH=/work/src:\$PATH prove \$(ls ci/test-*.pl | grep -v internet-hosts)"
          '

  Test-Mac:
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          brew install automake lcov
          ci/build-2-test-command.sh
          ci/build-3-prepare-macos.sh

      - name: Build
        run: |
          ci/build-4-compile.sh

      - name: Test
        run: |
          set -ex
          PATH=`pwd`/src:$PATH
          export SKIP_IPV6=1
          prove $(ls ci/test-*.pl|grep -v internet-hosts)
          ci/run-lcov.sh

      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          flag-name: macos
          parallel: true

  Coveralls-Finish:
    needs: [Test-Linux, Test-Mac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  Release-Tarball:
    needs: [Test-Linux, Test-Mac]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq 
          sudo apt-get install libcap2-bin libtest-command-perl

      - name: Build
        run: |
          ci/build-1-autotools.sh
          ci/build-4-compile.sh
          ci/test-tarball.sh

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: fping-*.tar.gz
