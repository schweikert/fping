name: Verify Actions Lock
on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '17 3 * * 1' # Every Monday at 03:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  Verify-Actions-Lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify workflow lockfile
        run: gh actions-lock --verify
